name: Browser QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tools/production-smoke.mjs
      - run: node tools/home-polish-qa.mjs
      - run: node tools/browser-qa.mjs
      - run: node tools/workshop-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shapeweaver-browser-qa
          path: browser-qa/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shapeweaver-home-review
          path: browser-qa/home-review/
          if-no-files-found: warn
