name: Set up pinned Chromium QA
description: Install the optional QA dependency and cache the version-matched browser download; always install required system libraries.
runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --no-save --package-lock=false playwright@1.51.1
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-1.51.1-chromium
    - shell: bash
      run: npx playwright install --with-deps chromium
