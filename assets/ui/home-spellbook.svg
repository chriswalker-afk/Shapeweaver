<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 132">
<title>The book of the four transformation spells</title>
<defs>
<linearGradient id="bg" x2="0%" y2="100%"><stop stop-color="#382d54"/><stop offset="1" stop-color="#262139"/></linearGradient>
<radialGradient id="light"><stop stop-color="#d5afea" stop-opacity=".65"/><stop offset="1" stop-color="#d5afea" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x2="85%" y2="100%"><stop stop-color="#ffedb9"/><stop offset=".55" stop-color="#c79760"/><stop offset="1" stop-color="#795343"/></linearGradient>
<clipPath id="frame"><rect x="4" y="4" width="152" height="124" rx="16"/></clipPath>

</defs>
<g clip-path="url(#frame)">
